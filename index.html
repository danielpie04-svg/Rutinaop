<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Dashboard</title>
</head>
<body>
  <h1>Mi Dashboard</h1>
  <div id="tabla"></div>

  <script>
    // Link público de tu Google Sheets (CSV)
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWBVaIOG8-yplUBgSDbZBCH9jbET5g_sjEHUOzitSytMonlpknrH5dAvyESVdD9vldvquvEt4EbZyn/pub?output=csv";

    fetch(url)
      .then(res => res.text())
      .then(data => {
        console.log("Contenido CSV:", data); // 👀 verás el texto crudo en consola

        // Separar filas por salto de línea
        const filas = data.trim().split("\n").map(r => r.split(","));

        // Construir tabla HTML
        let html = "<table border='1' cellspacing='0' cellpadding='5'>";
        filas.forEach(fila => {
          html += "<tr>";
          fila.forEach(celda => {
            html += "<td>" + celda + "</td>";
          });
          html += "</tr>";
        });
        html += "</table>";

        document.getElementById("tabla").innerHTML = html;
      })
      .catch(err => console.error("Error al cargar CSV:", err));
  </script>
</body>
</html>
